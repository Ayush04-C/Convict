name: Foundation checks
on: [push, pull_request]
jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m ruff check .
      - run: python -m pytest
      - run: python -m scripts.demo
      - run: python -m scripts.ledger_demo --temporary
      - run: python -m scripts.provider_demo
      - run: python -m scripts.context_demo
      - run: python -m scripts.context_demo --timeout-agent
      - run: python -m scripts.api_demo
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/leo-browser" --no-save --ignore-scripts playwright@1.62.1
          "$RUNNER_TEMP/leo-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Test upload UI with offline providers
        run: node tests/web_smoke.cjs
        env:
          NODE_PATH: ${{ runner.temp }}/leo-browser/node_modules
